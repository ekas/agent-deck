name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Prüfen und Testen
    # Muss Windows sein: die Testsuite fasst Win32 an (Arbeitsbereich des Monitors,
    # Prozesskette) und importiert tkinter.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten (Laufzeit + Werkzeuge)
        # -e . macht `deck` importierbar, ohne am sys.path zu schrauben.
        run: pip install -e ".[dev]"

      - name: Kompilieren aller Module (Syntaxprüfung)
        run: python -m compileall -q .

      - name: Linter
        run: python -m ruff check .

      - name: Typprüfung
        # Nur die anzeigefreien Schichten - siehe [tool.mypy] in pyproject.toml.
        run: python -m mypy

      - name: Unit-Tests
        run: python -m pytest tests/ -q

      - name: Testlauf ohne pytest
        # Der eigene Runner ist der Weg, den das Repo ohne Test-Abhängigkeit anbietet -
        # er muss darum genauso grün sein wie der pytest-Lauf.
        run: python tests/run.py
