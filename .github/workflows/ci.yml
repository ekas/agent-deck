name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Prüfen und Testen
    # Muss Windows sein: die Testsuite fasst Win32 an (Arbeitsbereich des Monitors,
    # Prozesskette) und importiert tkinter.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten (Laufzeit + Werkzeuge)
        # -e . macht `deck` importierbar, ohne am sys.path zu schrauben.
        run: pip install -e ".[dev]"

      - name: Kompilieren aller Module (Syntaxprüfung)
        run: python -m compileall -q .

      - name: PowerShell-Skripte parsen
        # Die .ps1-Dateien sind der einzige Weg in das Projekt hinein (install.ps1) und
        # der Wächter-Installer. Ein Tippfehler darin fällt sonst erst dem auf, der das
        # Repo gerade zum ersten Mal klont - also genau dem falschen.
        shell: pwsh
        run: |
          $fehler = @()
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e) { $fehler += "$($f.Name): $($e -join '; ')" }
          }
          if ($fehler) { $fehler | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "ok - $((Get-ChildItem -Filter *.ps1).Count) Skript(e) parsen fehlerfrei"

      - name: Linter
        run: python -m ruff check .

      - name: Typprüfung
        # Nur die anzeigefreien Schichten - siehe [tool.mypy] in pyproject.toml.
        run: python -m mypy

      - name: Unit-Tests
        run: python -m pytest tests/ -q

      - name: Testlauf ohne pytest
        # Der eigene Runner ist der Weg, den das Repo ohne Test-Abhängigkeit anbietet -
        # er muss darum genauso grün sein wie der pytest-Lauf.
        run: python tests/run.py
