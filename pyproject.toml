# Paket-Metadaten und Werkzeug-Konfiguration.
#
# Der Sinn des Pakets ist NICHT die Veröffentlichung, sondern dass `deck` importierbar
# ist, ohne dass jemand am sys.path schraubt: `pip install -e .` genügt. Vorher lag die
# Repo-Wurzel per sys.path.insert in tests/helpers.py auf dem Pfad — das funktionierte,
# war aber ein Import mit Nebenwirkung.
#
# Die Trennung der Abhängigkeiten ist Absicht: zur LAUFZEIT bleibt es bei Pillow (plus
# Standardbibliothek), die Werkzeuge stehen unter [dev] und laufen nur hier und in der CI.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-deck"
version = "1.0.0"
description = "Dashboard für parallel laufende Claude-Code-Agents in VS Code"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
# Nur Werkzeuge. Nichts hiervon wird zur Laufzeit importiert.
dev = ["ruff>=0.14", "mypy>=1.11", "pytest>=8.0"]

[tool.setuptools.packages.find]
# Nur das Paket. Die fünf Einsprungpunkte im Wurzelverzeichnis (report.py, statusline.py,
# agent_deck.py, watchdog.py, reenable_glow.py) sind bewusst KEINE Module: ihre Pfade
# stehen in ~/.claude/settings.json und in der Windows-Aufgabenplanung.
include = ["deck*"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100          # wie .editorconfig
target-version = "py312"
extend-exclude = ["assets"]

[tool.ruff.lint]
# Bewusst knapp: echte Fehlerklassen und Modernisierung, keine Stil-Debatten.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes - ungenutzte Importe/Namen
    "I",        # isort - Import-Reihenfolge
    "UP",       # pyupgrade - veraltete Syntax
    "B",        # bugbear - echte Fallen
    "C4",       # comprehensions
    "SIM115",   # open() ohne Context-Manager - fand 5 offene Handles je Testlauf
    "RUF",      # ruff-eigene Regeln
]
ignore = [
    "E501",     # Zeilenlänge - separat über line-length geprüft
    # RUF001/002/003 melden "ambiguous unicode" - Zeichen, die lateinischen ähneln.
    # In einem Repo mit deutschen Kommentaren trifft das die Umlaute und die
    # typografischen Zeichen (– „ " …) und ergab 628 von 879 Meldungen, alle falsch.
    # Die Regel ist für Codebasen gedacht, in denen ein kyrillisches А in einem
    # Bezeichner steckt; genau dagegen schützt hier F821 bzw. der Testlauf.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# helpers.py legt die Repo-Wurzel auf den sys.path, DAMIT die deck-Importe darunter
# funktionieren - ohne installiertes Paket ist das die Reihenfolge, nicht ein Versehen.
# Darum dort keine Import-Sortierung und kein "Import nicht am Dateianfang".
"tests/helpers.py" = ["E402", "I001"]
# Die Einsprungpunkte sind Vertragsdateien mit genau einem runpy-Aufruf.
"agent_deck.py" = ["I001"]
# In Tests baut eine Zeile oft den Fake UND setzt seinen Zustand
# (`f, _ = _fake_deck(); f._pending_auto = {...}`). Das ist eine gedankliche Einheit;
# auseinandergezogen verliert das Setup seine Lesbarkeit.
"tests/*" = ["E702"]

[tool.ruff.lint.isort]
known-first-party = ["deck"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# pythonpath ersetzt den sys.path-Hack: pytest legt die Repo-Wurzel selbst auf den Pfad.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "error",
    # Pillow entfernt Image.getdata() in Version 14 (Oktober 2027) zugunsten von
    # get_flattened_data(). Die Bildtests vergleichen damit Pixel für Pixel. Umgestellt
    # wird, sobald die neue Methode in der Mindestversion (Pillow>=10) verfügbar ist -
    # vorher würde das Repo eine höhere Pillow-Version erzwingen.
    "default:Image.Image.getdata is deprecated:DeprecationWarning",
]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
# Zunächst nur die anzeigefreien Schichten. ui/ und dock/ hängen an tkinter, wo
# Annotationen wenig tragen und viele Ignores nötig wären.
files = ["deck/domain", "deck/net", "deck/platform", "deck/claude", "deck/ops"]
ignore_missing_imports = true      # PIL und tkinter bringen keine vollständigen Stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Fertig annotierte Pakete werden hier scharf gestellt: eine neue Funktion ohne
# Signatur macht mypy rot. Die Liste wächst, während die Annotationen wandern -
# so bleibt der Fortschritt geprüft statt behauptet.
module = ["deck.domain.*", "deck.net.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# ctypes-Aufrufe sind von Natur aus untypisiert; hier trägt eine Annotation nichts.
module = ["deck.platform.win32", "deck.platform.layered"]
disallow_untyped_defs = false
